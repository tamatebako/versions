name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  repository_dispatch:
    types: [runtime-published, payload-published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload site-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

      - name: Refresh www.tebako.org/versions
        # Closes the refresh loop: the catalog goes live within minutes of
        # the build instead of waiting for tebako.org's nightly cron (the
        # cron stays as the backstop). Needs actions:write on
        # tamatebako/tebako.org on the org PAT; a failed ping never fails
        # the build.
        if: success()
        continue-on-error: true
        run: gh workflow run build_deploy --repo tamatebako/tebako.org --ref main
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN || secrets.GITHUB_TOKEN }}
