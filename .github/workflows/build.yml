name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *"
  repository_dispatch:
    types: [runtime-published, payload-published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload site-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

      # The fleet identity (tebako-release#3): the tebako-fleet App's
      # installation token — its own rate budget instead of the shared
      # per-user PAT. Same-org dispatch (tamatebako/tebako.org), so the
      # default installation covers it.
      - name: Mint the fleet token
        id: fleet
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.TEBAKO_CI_APP_ID }}
          private-key: ${{ secrets.TEBAKO_CI_APP_PRIVATE_KEY }}
      - name: Refresh www.tebako.org/versions
        # Closes the refresh loop: the catalog goes live within minutes of
        # the build instead of waiting for tebako.org's nightly cron (the
        # cron stays as the backstop). Needs actions:write on
        # tamatebako/tebako.org, which the fleet App carries; a failed
        # ping never fails the build.
        if: success()
        continue-on-error: true
        run: gh workflow run build_deploy --repo tamatebako/tebako.org --ref main
        env:
          GH_TOKEN: ${{ steps.fleet.outputs.token }}
