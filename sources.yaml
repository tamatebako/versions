factories:
  # Official runtime factories = every tebako-runtime-<engine> repo in the
  # org (discovered). Triplets are discovered from the factories' release
  # manifests. No ecosystem state lives in this file — only subjects.
  org: tamatebako
  prefix: tebako-runtime-
feedstocks:
  org: tebako-packages
product:
  - { repo: tamatebako/tebako }
