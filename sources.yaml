factories:
  - { repo: tamatebako/tebako-runtime-ruby,   engine: ruby }
  - { repo: tamatebako/tebako-runtime-python, engine: python }
  - { repo: tamatebako/jruby,                 engine: jruby }
  - { repo: tamatebako/truffleruby,           engine: truffleruby }
  - { repo: tamatebako/openjdk,               engine: openjdk }
feedstocks:
  org: tebako-packages
  registry_file: tpkg-registry.yaml
  # Runtime feedstocks live in the tamatebako org (spec 33 runtime-on-runtime):
  # their in-repo registries carry the kind: runtime L3 rows (graalvm rides
  # openjdk's registry).
  repos: [tamatebako/jruby, tamatebako/truffleruby, tamatebako/openjdk]
product:
  - { repo: tamatebako/tebako }
triplets: [macos-arm64, macos-x86_64, linux-gnu-x86_64, linux-gnu-arm64,
           linux-musl-x86_64, linux-musl-arm64, windows-ucrt64]
checksum_names: [SHA256SUMS.txt, SHA256SUMS]
